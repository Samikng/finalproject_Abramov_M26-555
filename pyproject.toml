[project]
name = "finalproject_Abramov_M26-555"
version = "0.1.0"
description = "ValutaTrade Hub — консольная платформа для отслеживания и симуляции торговли фиатными и криптовалютами"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.10",
    "requests>=2.32",
]

[project.scripts]
project = "valutatrade_hub.cli.interface:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.valutatrade]
data_dir = "data"
users_file = "users.json"
portfolios_file = "portfolios.json"
rates_file = "rates.json"
history_file = "exchange_rates.json"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_dir = "logs"
log_level = "INFO"
log_format = "%(levelname)s %(asctime)s %(message)s"
log_date_format = "%Y-%m-%dT%H:%M:%S"
log_max_bytes = 1048576
log_backup_count = 5
